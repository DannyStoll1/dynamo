[package]
name = "dynamo_wasm"
version = "1.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Danny Stoll"]
repository = "https://github.com/dannystoll1/dynamo"
description = "A tool for studying discrete time dynamical systems - Web UI"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dynamo_app = { path = "../app" }
web-sys = "0.3"
eframe = { workspace = true, features = ["glow"] }
# eframe = { version = "0.29" }
console_error_panic_hook = "0.1.7"
log = "0.4.29"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.4", features = ["wasm_js"] }

# The numeric stack (spfunc -> cauchy -> rand 0.8 -> rand_core 0.6)
# transitively requires getrandom 0.2, whose wasm32-unknown-unknown
# support is gated behind its `js` feature. cauchy 0.4 (latest) still
# pins rand 0.8, so this older line cannot be removed by version bumps;
# enabling the feature here turns it on tree-wide via unification.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack's default wasm-opt invocation omits the wasm features the
# Rust toolchain now emits (bulk-memory, nontrapping-float-to-int, ...),
# failing validation. Override the flags so wasm-pack runs an aggressive
# size pass with the modern feature set enabled. wasm-pack only honors
# this metadata for the built-in `release` profile.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '--all-features']

[lints]
workspace = true
